coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error

ignore:
  - "tasks.py"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
