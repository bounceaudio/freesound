name: CI Build
on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
jobs:
  execute:
    name: CI Build
    runs-on: ubuntu-latest
    container:
      image: "python:3.14-trixie"
    steps:
      - uses: actions/checkout@v4
      - name: Install and build
        run: |
          apt-get update
          apt-get install -y -qq build-essential
          pip install uv==0.9.6
          export PYTHONPATH="$GITHUB_WORKSPACE" ; uv run invoke build
